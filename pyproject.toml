[project]
name = "inbox-agent"
version = "0.1.0"
description = "An AI agent that monitors an email inbox: triage, RAG Q&A, and draft replies with human-in-the-loop control. Milestone 1: synthetic-data triage + eval."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Dhruv M" }]
keywords = ["email", "triage", "llm", "rag", "agent", "evals"]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# Opt-in real-Gmail path (read-only). Never required to run the project.
gmail = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]
# Web UI backend. Serves the JSON API the Next frontend talks to.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
]

[project.scripts]
inbox-agent = "inbox_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# E501 (line length) is enforced by the formatter; ignore the linter's copy.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["inbox_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Unit tests must never hit the network; the integration test opts back in.
markers = [
    "integration: end-to-end flow tests (may be slower; still no network)",
]
