# ==========================================================================
# Inbox AI Agent — pre-commit hooks (secret protection + lint/format)
#
# One-time setup (from the repo root):
#   uv tool install pre-commit          # or: pipx install pre-commit
#   pre-commit autoupdate               # pin the latest hook versions
#   uv tool install detect-secrets      # or: pipx install detect-secrets
#   detect-secrets scan > .secrets.baseline   # create the baseline, then commit it
#   pre-commit install                  # activate hooks for this repo
#   pre-commit run --all-files          # first full scan
#
# Verify it blocks a leak (should FAIL, then delete the file):
#   printf 'AKIAIOSFODNN7EXAMPLE\naws_secret=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY\n' > leak_test.txt
#   git add leak_test.txt && git commit -m "test"     # <- expect BLOCKED
#   git restore --staged leak_test.txt && rm leak_test.txt
#
# Note: local hooks can be bypassed with `git commit --no-verify`, which is why
# the CI gitleaks job and GitHub Push Protection are required backstops.
# Versions below are current as of mid-2026; `pre-commit autoupdate` keeps them fresh.
# ==========================================================================

repos:
  # --- Core hygiene + secret-adjacent guards ------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key            # blocks PEM/SSH private keys
      - id: detect-aws-credentials        # blocks AWS keys
        args: ["--allow-missing-credentials"]
      - id: check-added-large-files       # stops accidental data/db dumps
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  # --- Gitleaks: fast, broad secret scanning (industry standard) ----------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # Honors a .gitleaks.toml in the repo root if you need custom rules
        # or an allowlist for fake secrets in data/synthetic/ (see note below).

  # --- detect-secrets: entropy + baseline workflow (second opinion) -------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # Synthetic fixtures contain deliberately fake "phishing"/secret-like
        # text; exclude them so they don't cause false positives:
        exclude: |
          (?x)^(
            data/synthetic/.*|
            data/golden/.*|
            uv\.lock|
            \.secrets\.baseline
          )$

  # --- Ruff: lint (with autofix) then format ------------------------------
  # Hook ids are ruff-check / ruff-format in current ruff-pre-commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

# ==========================================================================
# Optional hardening if the synthetic corpus trips gitleaks:
# create a .gitleaks.toml in the repo root with an allowlist, e.g.
#
#   title = "inbox-agent gitleaks config"
#   [extend]
#   useDefault = true
#   [allowlist]
#   description = "Synthetic test data contains fake secrets by design"
#   paths = ['''^data/synthetic/.*''', '''^data/golden/.*''']
#
# Prefer narrow allowlists (specific paths) over disabling rules globally.
# ==========================================================================
