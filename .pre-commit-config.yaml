# Hooks that BLOCK a commit containing a leaked credential.
#
# Setup:
#   uv run pre-commit install
#
# Both scanners are here on purpose — they have different blind spots.
# gitleaks catches PEM keys and realistic provider tokens; detect-secrets
# catches high-entropy strings and the vendor "example" keys that gitleaks
# allowlists. Neither alone is sufficient.
#
# Hooks can be bypassed with `git commit --no-verify`, which is why CI and
# GitHub Push Protection exist as backstops.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # The synthetic corpus contains fake phishing text by design.
        exclude: ^(data/.*|uv\.lock|\.secrets\.baseline)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files # stops accidental data/db dumps
        args: ["--maxkb=500"]
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
